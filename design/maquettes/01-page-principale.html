<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Piste B tuiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:600px;box-sizing:border-box;padding:14px 14px 16px;background:linear-gradient(160deg,#3a3f4a 0%,#23262d 55%,#1a1c21 100%);color:#fff;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;border-radius:12px">

<!-- Illustrations au trait (style du filigrane AirPods), la couleur du voyant vient de --g -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="sphone" viewBox="0 0 44 80">
<rect x="3" y="3" width="38" height="74" rx="10" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity=".30" stroke-width=".8"/>
<rect x="15" y="8" width="14" height="4" rx="2" fill="#fff" fill-opacity=".22"/>
<circle cx="22" cy="52" r="15" fill="var(--g)" fill-opacity=".10"/><circle cx="22" cy="52" r="9" fill="var(--g)" fill-opacity=".20"/><circle cx="22" cy="52" r="4" fill="var(--g)" fill-opacity=".45"/><circle cx="22" cy="52" r="1.8" fill="var(--g)"/>
</symbol>
<symbol id="srouter" viewBox="0 0 76 52">
<rect x="16" y="6" width="3" height="22" rx="1.5" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<rect x="57" y="6" width="3" height="22" rx="1.5" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<rect x="3" y="28" width="70" height="20" rx="10" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<circle cx="20" cy="38" r="1.4" fill="#fff" fill-opacity=".35"/><circle cx="28" cy="38" r="1.4" fill="#fff" fill-opacity=".35"/>
<circle cx="56" cy="38" r="9" fill="var(--g)" fill-opacity=".14"/><circle cx="56" cy="38" r="5" fill="var(--g)" fill-opacity=".28"/><circle cx="56" cy="38" r="1.8" fill="var(--g)"/>
</symbol>
<symbol id="smonitor" viewBox="0 0 76 56">
<rect x="6" y="4" width="58" height="36" rx="6" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<path d="M31 40 L29 50 L47 50 L45 40" fill="none" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<path d="M24 51 H52" stroke="#fff" stroke-opacity=".30" stroke-width=".8" stroke-linecap="round"/>
<circle cx="35" cy="22" r="13" fill="var(--g)" fill-opacity=".12"/><circle cx="35" cy="22" r="7" fill="var(--g)" fill-opacity=".24"/><circle cx="35" cy="22" r="2" fill="var(--g)"/>
<path d="M68 15 a9 9 0 0 1 0 14 M72.5 10 a16 16 0 0 1 0 24" fill="none" stroke="var(--g)" stroke-opacity=".5" stroke-width=".8" stroke-linecap="round"/>
</symbol>
<symbol id="scase" viewBox="0 0 76 52">
<rect x="3" y="4" width="70" height="46" rx="20" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<path d="M3 24 L73 24" stroke="#fff" stroke-opacity=".30" stroke-width=".6"/>
<circle cx="38" cy="35" r="11" fill="var(--g)" fill-opacity=".14"/><circle cx="38" cy="35" r="6" fill="var(--g)" fill-opacity=".28"/><circle cx="38" cy="35" r="1.8" fill="var(--g)"/>
</symbol>
</defs>
</svg>

<div style="display:flex;align-items:center;justify-content:space-between;height:40px;margin-bottom:8px">
<div style="display:flex;align-items:center;gap:10px"><div style="width:26px;height:26px;border-radius:50%;background:#fff"></div><span style="font-size:17px;font-weight:600">Duckast</span></div>
<button aria-label="Réglages" style="width:32px;height:32px;border-radius:16px;border:0;background:rgba(120,120,128,.24);color:#fff;font-size:15px">⚙</button>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">

<!-- iPhone · connecté : nom en haut, statut dessous -->
<div style="position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(48,209,88,.30),rgba(48,209,88,.10));border:1px solid rgba(48,209,88,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);border-radius:18px;padding:14px;height:112px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
<svg width="56" height="102" style="--g:#30D158;position:absolute;right:12px;top:5px;transform:rotate(9deg)" aria-hidden="true"><use href="#sphone"/></svg>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center;height:24px">
<div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">iPhone de Selim</div>
<button aria-label="Arrêter la réception" style="width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.25);color:#fff;font-size:10px;flex:none">✕</button>
</div>
<div style="position:relative">
<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#30D158"><span style="width:6px;height:6px;border-radius:50%;background:#30D158;box-shadow:0 0 6px #30D158"></span>Connecté</div>
<div style="font-size:12px;color:rgba(235,235,245,.6);margin-top:1px">Son sur ce PC</div>
</div>
</div>

<!-- Réseau local · toujours en écoute -->
<div style="position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);border-radius:18px;padding:14px;height:112px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
<svg width="161" height="112" viewBox="0 0 161 112" style="position:absolute;left:0;top:0" aria-hidden="true"><circle cx="122" cy="58" r="36" fill="#fff" fill-opacity=".06"/><g fill="none" stroke="#fff" stroke-opacity=".30" stroke-width=".9"><circle cx="122" cy="58" r="36"/><ellipse cx="122" cy="58" rx="14" ry="36"/><ellipse cx="122" cy="58" rx="27" ry="36"/><path d="M86 58 H158"/><path d="M89.8 42 Q122 48 154.2 42"/><path d="M89.8 74 Q122 68 154.2 74"/></g><circle cx="140" cy="46" r="9" fill="#fff" fill-opacity=".16"/><circle cx="140" cy="46" r="3" fill="#fff"/></svg>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center;height:24px">
<div style="font-size:14px;font-weight:600">Réseau local</div>
</div>
<div style="position:relative">
<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(235,235,245,.6)"><span style="width:6px;height:6px;border-radius:50%;background:rgba(235,235,245,.4)"></span>En écoute</div>
<div style="font-size:12px;color:rgba(235,235,245,.6);margin-top:1px">Aucun PC</div>
</div>
</div>

<!-- Envoyer · éteint -->
<div style="position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);border-radius:18px;padding:14px;height:112px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
<svg width="140" height="104" style="--g:#4DA3FF;position:absolute;right:-34px;top:2px" aria-hidden="true"><use href="#smonitor"/></svg>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center;height:24px">
<div style="font-size:14px;font-weight:600">Envoyer</div>
</div>
<div style="position:relative">
<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(235,235,245,.6)"><span style="width:6px;height:6px;border-radius:50%;background:rgba(235,235,245,.4)"></span>Éteint</div>
<div style="font-size:12px;color:rgba(235,235,245,.6);margin-top:1px">vers SURFACE-11</div>
</div>
</div>

<!-- AirPods · connectés : les trois niveaux en bas -->
<div style="position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(48,209,88,.30),rgba(48,209,88,.10));border:1px solid rgba(48,209,88,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);border-radius:18px;padding:14px;height:112px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
<svg width="170" height="116" style="--g:#30D158;position:absolute;right:-44px;top:-14px" aria-hidden="true"><use href="#scase"/></svg>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center;height:24px">
<div style="font-size:14px;font-weight:600;white-space:nowrap">AirPods Pro</div>
<button aria-label="Déconnecter les AirPods" style="width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.25);color:#fff;font-size:10px;flex:none">✕</button>
</div>
<div style="position:relative">
<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#30D158;margin-bottom:5px"><span style="width:6px;height:6px;border-radius:50%;background:#30D158;box-shadow:0 0 6px #30D158"></span>Connectés</div>
<div style="display:flex;gap:9px">
<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:10.5px;line-height:13px"><span style="color:rgba(235,235,245,.7)">G</span><span>100</span></div><div style="height:3px;border-radius:2px;background:rgba(0,0,0,.22);margin-top:3px"><div style="width:100%;height:3px;border-radius:2px;background:#fff"></div></div></div>
<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:10.5px;line-height:13px"><span style="color:rgba(235,235,245,.7)">D</span><span>100</span></div><div style="height:3px;border-radius:2px;background:rgba(0,0,0,.22);margin-top:3px"><div style="width:100%;height:3px;border-radius:2px;background:#fff"></div></div></div>
<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:10.5px;line-height:13px"><span style="color:rgba(235,235,245,.7)">B</span><span>80</span></div><div style="height:3px;border-radius:2px;background:rgba(0,0,0,.22);margin-top:3px"><div style="width:80%;height:3px;border-radius:2px;background:#fff"></div></div></div>
</div>
</div>
</div>
</div>

<!-- Volume : grande tuile pleine largeur -->
<div style="margin-top:10px;position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;height:150px;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;letter-spacing:.06em;color:rgba(235,235,245,.6);font-weight:600">SON REÇU</span><span style="font-size:15px;font-weight:600">62 %</span></div>
<div style="margin-top:14px;height:44px;border-radius:14px;background:rgba(120,120,128,.30);position:relative;overflow:hidden;display:flex;align-items:center">
<div style="position:absolute;left:0;top:0;bottom:0;width:62%;background:rgba(255,255,255,.92)"></div>
<span style="position:relative;margin-left:14px;color:#1b1d22;font-size:17px">♪</span>
</div>
<div style="height:34px;border-radius:9px;background:rgba(120,120,128,.24);display:grid;grid-template-columns:repeat(3,1fr);padding:2px;gap:2px;box-sizing:border-box;margin-top:14px">
<div style="display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(235,235,245,.6)">Gauche</div>
<div style="display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:7px;background:rgba(142,142,147,.55)">Stéréo</div>
<div style="display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(235,235,245,.6)">Droite</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
